<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carryon early access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one phone-width screen per step, the prototype's flow; copy at the top, action anchored at the bottom. Single light theme, as in the prototype. */
  --page: #e9ece9;
  --bg: #ffffff;
  --ink: #111814;
  --muted: #69716c;
  --line: #e3e5e2;
  --soft: #f4f3f1;
  --green: #0f6b4b;
  --green-soft: #e4f1e9;
  --warn: #b3412a;
  --font: "Manrope", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.phone {
  max-width: 430px; min-height: 100%; margin: 0 auto; background: var(--bg);
  display: flex; flex-direction: column;
}
@media (min-width: 560px) {
  body { padding: 24px 0; }
  .phone { min-height: calc(100% - 0px); border-radius: 28px; box-shadow: 0 24px 60px -30px rgba(17, 24, 20, 0.35); border: 1px solid var(--line); }
}
.screen { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 22px 22px 26px; }
.preview { margin: 14px 22px 0; font-size: 12.5px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 9px 12px; }
.preview b { color: var(--ink); }

/* Top bar with back button and step progress */
.bar { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: center; }
.back { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--soft); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.back svg { width: 18px; height: 18px; }
.steps { display: grid; gap: 7px; font-size: 14px; font-weight: 600; color: var(--muted); }
.track { height: 5px; background: var(--line); border-radius: 5px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--green); border-radius: 5px; transition: width 0.35s ease; }

.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; margin-top: 18px; }
.logo svg { width: 24px; height: 24px; color: var(--green); }
h1 { margin: 0; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.025em; text-wrap: balance; }
h1.hero { font-size: 42px; line-height: 1.04; letter-spacing: -0.035em; }
.sub { margin: -8px 0 0; color: var(--muted); font-size: 16.5px; max-width: 38ch; }
.label { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
.center { text-align: center; }
.spacer { flex: 1; }

.route { display: flex; align-items: center; gap: 12px; }
.pill { border: 0; font: inherit; font-weight: 600; font-size: 15px; padding: 8px 15px; border-radius: 999px; background: var(--soft); color: var(--ink); }
button.pill { cursor: pointer; }
.pill.to { background: var(--green-soft); color: var(--green); }
.route svg { width: 30px; height: 14px; color: var(--muted); }

/* Rows, as on Verify it's you */
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; background: var(--soft); border-radius: 14px; padding: 14px; }
.row.outlined { background: var(--bg); border: 1.5px solid var(--line); }
.row .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; color: var(--muted); font-weight: 800; font-size: 12px; }
.row .ic.ok { color: var(--green); }
.row .ic svg { width: 18px; height: 18px; }
.row .t { font-weight: 700; font-size: 15.5px; }
.row .d { font-size: 13px; color: var(--muted); }
.row .tag { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.row .tag.go { color: var(--green); }
.row-body { display: grid; gap: 10px; grid-column: 1 / -1; }

.q { display: grid; gap: 10px; }
.q-title { font-weight: 700; font-size: 15.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14.5px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.text-input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; width: 100%; }
.text-input::placeholder { color: var(--muted); opacity: 0.75; }

/* PAN card, illustrative */
.scan { background: #151a17; border-radius: 18px; padding: 22px; position: relative; }
.scan .corner { position: absolute; width: 26px; height: 26px; border: 3px solid #3fb57e; }
.scan .c1 { top: 12px; left: 12px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.scan .c2 { top: 12px; right: 12px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.scan .c3 { bottom: 12px; left: 12px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.scan .c4 { bottom: 12px; right: 12px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.pan { background: linear-gradient(135deg, #efe6cf, #e2d6b6); border-radius: 12px; padding: 14px 16px; color: #3d3626; display: grid; grid-template-columns: 64px 1fr; gap: 6px 14px; }
.pan .h { grid-column: 1 / -1; font-size: 10px; font-weight: 800; letter-spacing: 0.12em; }
.pan .photo { width: 64px; height: 74px; background: #cdbf9c; border-radius: 6px; }
.pan .nm { font-weight: 700; font-size: 13px; align-self: end; }
.pan .no { font-weight: 800; letter-spacing: 0.12em; font-size: 14px; }
.scan .badge { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); background: var(--green); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }

/* Consent */
.report { display: grid; grid-template-columns: 46px 1fr; gap: 14px; align-items: center; background: var(--soft); border-radius: 14px; padding: 14px; }
.report .flag { width: 46px; height: 46px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.reads { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reads li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 15.5px; }
.reads svg { width: 18px; height: 18px; margin-top: 2px; }
.reads .y { color: var(--green); }
.reads .n { color: var(--muted); }
.check { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; border-radius: 14px; padding: 16px; cursor: pointer; }
.check.box { border: 1.5px solid var(--ink); }
.check.soft { background: var(--soft); }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--green); }
.check .d { display: block; font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.who { font-size: 13px; color: var(--muted); }

/* Price */
.pricebox { border: 1.5px solid var(--green); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
.price { display: flex; align-items: baseline; gap: 10px; font-weight: 800; font-size: 44px; letter-spacing: -0.03em; line-height: 1; }
.price small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.why { background: var(--green-soft); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 24px 1fr; gap: 12px; }
.why svg { width: 20px; height: 20px; color: var(--green); margin-top: 1px; }
.why b { display: block; font-size: 15px; margin-bottom: 2px; }
.why span { font-size: 14px; color: var(--muted); }
.note { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.note .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; color: var(--muted); }
.note .ic svg { width: 18px; height: 18px; }

/* Bottom actions */
.foot { display: grid; gap: 12px; }
.btn { font: inherit; font-weight: 700; font-size: 16.5px; border: 0; border-radius: 14px; padding: 17px 18px; cursor: pointer; width: 100%; }
.btn.primary { background: var(--green); color: #fff; }
.btn.primary[disabled] { opacity: 0.35; cursor: not-allowed; }
.btn.link { background: none; color: var(--green); padding: 6px; font-size: 15.5px; }
.lock { display: flex; gap: 8px; justify-content: center; align-items: center; font-size: 13.5px; color: var(--muted); }
.lock svg { width: 14px; height: 14px; }
.error { color: var(--warn); font-size: 14px; font-weight: 600; }

/* Done, as on You're approved */
.done-mark { width: 82px; height: 82px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; margin: 26px auto 4px; }
.done-mark svg { width: 40px; height: 40px; }
.done-mark.pop { animation: pop 0.45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.timeline { list-style: none; margin: 0; padding: 16px; background: var(--soft); border-radius: 16px; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: -2px; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); background: var(--bg); margin-top: 4px; position: relative; z-index: 1; }
.timeline .on .dot { background: var(--green); border-color: var(--green); }
.timeline .on::before { background: var(--green); }
.timeline b { display: block; font-size: 15px; }
.timeline span { font-size: 13px; color: var(--muted); }
.share { display: flex; gap: 8px; }
.share code { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--soft); border-radius: 10px; padding: 11px 12px; overflow-x: auto; white-space: nowrap; }
.share .btn { width: auto; padding: 10px 16px; font-size: 14.5px; background: var(--soft); color: var(--ink); }

button:focus-visible, input:focus-visible { outline: 3px solid #3fb57e; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="phone">
  <div id="preview" class="preview" hidden></div>
  <main id="stage" class="screen" aria-live="polite"></main>
</div>

<script>
/* ---------- Settings the team edits ---------- */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbwH6klO_seAHuHSKWXlLjDDoCWLmrzYUB8TVICF1y9tz1PZZBuhueqs47kzTj53x3EHrw/exec", // Google Apps Script web app URL. Empty = preview, nothing is saved.
  PUBLIC_URL: "https://tasosger.github.io/carryon/", // Public address of this page, used for invite links.
  CONTACT_EMAIL: "ag2766@cornell.edu",  // Shown on the consent and privacy text.
  PRICES: [19, 29, 49]                  // Founding prices tested at random, in US dollars.
};

/* ---------- Answer options (these exact words land in the sheet) ---------- */
const COUNTRIES = ["India", "China", "Nigeria", "Mexico", "South Korea", "Brazil", "United Kingdom", "Somewhere else"];
const VISAS = ["F-1 student visa", "H-1B or other work visa", "Another visa", "No visa yet"];
const ARRIVALS = ["I'm already in the US", "Within a month", "In 1 to 3 months", "More than 3 months away"];
const NEEDS = ["Credit card", "Apartment lease", "Phone plan", "Car loan or insurance", "Something else"];
const EXPERIENCE = ["Declined for a credit card", "Asked for a guarantor or extra deposit", "Only offered a secured card", "Haven't applied for anything yet", "None of these"];
const SCORE = ["Yes", "No", "Not sure"];
const BANDS = ["750 or higher", "700 to 749", "650 to 699", "Below 650", "I don't know"];
const YESNO = ["Yes", "No"];
const HEARD = ["University email", "Student association", "WhatsApp or Telegram group", "A friend", "Instagram or LinkedIn", "Somewhere else"];
// last_step = the last screen finished: 0 opened, 1 verify, 2 PAN, 3 consent, 4 price, 5 match, 6 joined
const STEP_NAMES = ["opened", "verify", "pan", "consent", "price", "match", "joined"];
const TOTAL_STEPS = 6;

/* ---------- State ---------- */
const STORE_KEY = "carryon-waitlist-v2";
const LIVE = Boolean(CONFIG.ENDPOINT);

function rid(n) {
  const a = "abcdefghjkmnpqrstuvwxyz23456789";
  const buf = new Uint32Array(n);
  window.crypto.getRandomValues(buf);
  let s = "";
  for (let i = 0; i < n; i++) s += a[buf[i] % a.length];
  return s;
}
function params() { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(""); } }
function freshState() {
  const q = params();
  const v = q.get("v"), p = Number(q.get("p"));
  return {
    session_id: rid(12), started_at: new Date().toISOString(),
    consent_variant: (v === "plain" || v === "controls") ? v : (Math.random() < 0.5 ? "plain" : "controls"),
    price_variant: CONFIG.PRICES.includes(p) ? p : CONFIG.PRICES[Math.floor(Math.random() * CONFIG.PRICES.length)],
    screen: 0, last_step: 0, picking_country: false,
    country: "India", status: "", university: "",
    home_score: "", home_score_band: "", pan: "",
    consent_given: "", share_report_early: "", price_choice: "",
    arrival: "", first_needs: [], experience: [],
    email: "", heard_from: "", contact_ok: false,
    ref_in: (q.get("ref") || "").slice(0, 20), ref_code: rid(6),
    source: (q.get("src") || q.get("utm_source") || "").slice(0, 40),
    opened_sent: false, position: null
  };
}
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return Object.assign(freshState(), JSON.parse(raw)); } catch (e) {}
  return freshState();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
let S;

/* ---------- Sending to the sheet ---------- */
function payload() {
  return {
    session_id: S.session_id, started_at: S.started_at,
    last_step: S.last_step, step_name: STEP_NAMES[S.last_step],
    consent_variant: S.consent_variant, price_variant: S.price_variant,
    country: S.country, status: S.status, university: S.university.trim(),
    arrival: S.arrival, first_needs: S.first_needs.join("; "), experience: S.experience.join("; "),
    home_score: S.home_score, home_score_band: S.home_score_band, pan: S.pan,
    consent_given: S.consent_given, share_report_early: S.share_report_early,
    price_choice: S.price_choice, email: S.email.trim(), heard_from: S.heard_from,
    ref_in: S.ref_in, ref_code: S.ref_code, source: S.source
  };
}
function send() {
  if (!LIVE) return Promise.resolve({ saved: false, preview: true });
  return fetch(CONFIG.ENDPOINT, {
    method: "POST", mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload())
  }).then(() => ({ saved: true })).catch(() => ({ saved: false }));
}
function fetchPosition() {
  if (!LIVE) return Promise.resolve(null);
  return fetch(CONFIG.ENDPOINT + (CONFIG.ENDPOINT.includes("?") ? "&" : "?") + "count=1")
    .then(r => r.json()).then(d => (d && Number.isFinite(d.joined) && d.joined > 0) ? d.joined : null)
    .catch(() => null);
}
function complete(step) { if (step > S.last_step) S.last_step = step; save(); return send(); }

/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const isIndia = () => S.country === "India";
const hereNow = () => S.arrival === ARRIVALS[0];
const emailOk = () => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email.trim());
const homeName = () => (S.country === "Somewhere else" ? "home" : S.country);

const I = {
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>',
  long: '<svg viewBox="0 0 30 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h27M22 2l6 5-6 5"></path></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18"></path></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg>'
};

function chips(key, options, multi) {
  const cur = S[key];
  return '<div class="chips" role="group">' + options.map(val => {
    const on = multi ? cur.includes(val) : cur === val;
    return '<button type="button" class="chip" data-key="' + key + '" data-value="' + esc(val) + '"' + (multi ? ' data-multi="1"' : "") + ' aria-pressed="' + on + '">' + esc(val) + "</button>";
  }).join("") + "</div>";
}
function check(id, key, cls, title, detail) {
  const on = S[key] === "yes" || S[key] === true;
  return '<label class="check ' + cls + '" for="' + id + '"><input type="checkbox" id="' + id + '" data-check="' + key + '"' + (on ? " checked" : "") + "><span>" + title + (detail ? '<span class="d">' + detail + "</span>" : "") + "</span></label>";
}
function bar(n) {
  return '<div class="bar"><button type="button" class="back" data-act="back" aria-label="Back">' + I.back + '</button>' +
    '<div class="steps"><span>Step ' + n + " of " + TOTAL_STEPS + '</span><div class="track"><i style="width:' + Math.round(n / TOTAL_STEPS * 100) + '%"></i></div></div></div>';
}
function primary(label, enabled, act) {
  return '<button type="button" class="btn primary" id="next" data-act="' + (act || "next") + '"' + (enabled ? "" : " disabled") + ">" + label + "</button>";
}

/* ---------- Screens, in the prototype's order ---------- */
function sWelcome() {
  const picker = S.picking_country
    ? '<div class="q"><div class="q-title">Where is your credit record from?</div>' + chips("country", COUNTRIES) + "</div>"
    : "";
  return '<div class="logo">' + I.arrow + "carryon</div>" +
    '<div class="spacer"></div>' +
    '<div class="route"><button type="button" class="pill" data-act="pick-country" aria-label="Change home country">' + esc(S.country === "Somewhere else" ? "Home" : S.country) + "</button>" + I.long + '<span class="pill to">United States</span></div>' +
    picker +
    '<h1 class="hero">Your credit history moved with you.</h1>' +
    '<p class="sub" style="margin-top:-4px">Turn your credit record from home into a US credit profile that banks trust. Get a card without starting from zero.</p>' +
    '<div class="spacer"></div>' +
    '<div class="foot">' + primary("Get early access", true, "start") +
      '<p class="small center" style="margin:0">Carryon isn\'t live yet. Join the waitlist in about 2 minutes.</p>' +
      '<div class="lock">' + I.lock + "<span>$" + S.price_variant + " once. We never sell your data.</span></div>" +
    "</div>";
}
function sVerify() {
  const uni = S.status === VISAS[0]
    ? '<div class="q"><label class="q-title" for="uni">Your university <span class="small">(optional)</span></label><input id="uni" class="text-input" data-text="university" autocomplete="organization" placeholder="e.g. NYU, Columbia, Cornell Tech" value="' + esc(S.university) + '"></div>'
    : "";
  return bar(1) +
    "<h1>Verify it's you</h1>" +
    '<p class="sub">No SSN needed. At launch you\'ll scan your passport and visa here in about 2 minutes. For now, tell us which visa you have.</p>' +
    '<div class="rows">' +
      '<div class="row"><div class="ic">' + I.doc + '</div><div><div class="t">Passport</div><div class="d">' + (isIndia() ? "Indian passport" : "Your passport") + '</div></div><span class="tag">At launch</span></div>' +
      '<div class="row outlined"><div class="ic' + (S.status ? " ok" : "") + '">' + (S.status ? I.check : I.doc) + '</div><div><div class="t">US visa</div><div class="d">' + (S.status ? esc(S.status) : "Which one do you have?") + '</div></div><span class="tag go">' + (S.status ? "" : "Choose") + "</span>" +
        '<div class="row-body">' + chips("status", VISAS) + "</div></div>" +
      '<div class="row"><div class="ic">' + I.user + '</div><div><div class="t">Quick selfie</div><div class="d">Matches you to your passport</div></div><span class="tag">At launch</span></div>' +
    "</div>" +
    uni +
    '<div class="spacer"></div>' +
    '<div class="foot"><p class="small center" style="margin:0">Your documents will be used only to verify identity. Never sold.</p>' + primary("Continue", Boolean(S.status)) + "</div>";
}
function sPan() {
  if (!isIndia()) {
    return bar(2) +
      "<h1>Your credit record from " + esc(homeName()) + "</h1>" +
      '<p class="sub">This is how we\'ll find your history back home at launch.</p>' +
      '<div class="q"><div class="q-title">Do you have a credit score in ' + esc(homeName()) + "?</div>" + chips("home_score", SCORE) + "</div>" +
      '<div class="spacer"></div>' +
      '<div class="foot">' + primary("Continue", Boolean(S.home_score)) + "</div>";
  }
  const band = S.home_score === "Yes"
    ? '<div class="q"><div class="q-title">Roughly what is it? <span class="small">(optional)</span></div>' + chips("home_score_band", BANDS) + "</div>"
    : "";
  return bar(2) +
    "<h1>Scan your PAN card</h1>" +
    '<p class="sub">Your PAN is how we find your record at CIBIL, India\'s credit bureau. Scanning opens at launch.</p>' +
    '<div class="scan" aria-hidden="true"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>' +
      '<div class="pan"><div class="h">PERMANENT ACCOUNT NUMBER</div><div class="photo"></div><div><div class="nm">YOUR NAME</div><div class="no">AB&bull;&bull;&bull;&bull;&bull;12C</div></div></div>' +
      '<span class="badge">Example</span></div>' +
    '<div class="q" style="margin-top:8px"><div class="q-title">Do you have a PAN card?</div>' + chips("pan", YESNO) + "</div>" +
    '<div class="q"><div class="q-title">Do you have a CIBIL score?</div>' + chips("home_score", SCORE) + "</div>" +
    band +
    '<div class="spacer"></div>' +
    '<div class="foot"><p class="small center" style="margin:0">Don\'t type your PAN here. At launch it\'s stored encrypted and used only to find your credit record, after you consent on the next screen.</p>' + primary("Continue", Boolean(S.home_score)) + "</div>";
}
function sConsent() {
  const bureau = isIndia() ? "CIBIL" : "credit bureau";
  const reportName = isIndia() ? "CIBIL credit report" : "Credit report from " + esc(homeName());
  const reads = S.consent_variant === "controls"
    ? '<div class="label">What we read</div>' +
      '<ul class="reads"><li><span class="y">' + I.check + '</span><span>Cards and loans you\'ve held</span></li>' +
      '<li><span class="y">' + I.check + '</span><span>Payment history, limits and balances</span></li>' +
      '<li><span class="n">' + I.x + '</span><span>Never your passwords. Never sold.</span></li></ul>' +
      '<p class="who">You choose every lender that sees your profile, and you can delete it any time. Carryon is built by Himali, Tasos, Varun and Elena, a student team at Cornell Tech. Questions? ' + esc(CONFIG.CONTACT_EMAIL) + "</p>"
    : "";
  return bar(3) +
    "<h1>Bring your credit history</h1>" +
    '<p class="sub">Nothing is fetched until you give consent below.</p>' +
    '<div class="report"><div class="flag">' + (isIndia() ? "IN" : "") + '</div><div><div style="font-weight:700;font-size:16px">' + reportName + '</div><div class="small">We\'ll find your record ' + (isIndia() ? "by PAN " : "") + "at launch</div></div></div>" +
    reads +
    check("c-consent", "consent_given", "box",
      "I'd authorize Carryon to fetch my " + bureau + " credit report" + (isIndia() ? " using my PAN" : "") + ", turn it into a US credit profile, and share it only with lenders I choose. I can withdraw consent anytime.",
      "Nothing is fetched today. We'll ask you to confirm at launch.") +
    check("c-early", "share_report_early", "soft",
      "<b>Optional: go first</b>",
      isIndia() ? "Email me to share my free annual CIBIL report now for an early US estimate." : "Email me to share my credit report now for an early US estimate.") +
    '<div class="spacer"></div>' +
    '<div class="foot">' + primary(S.consent_given === "yes" ? "Allow and continue" : "Continue", true) + "</div>";
}
function sPrice() {
  const p = S.price_variant;
  return bar(4) +
    "<h1>Unlock your US credit profile</h1>" +
    '<p class="sub">One price. No subscription, no hidden fees.</p>' +
    '<div class="pricebox"><div class="price">$' + p + "<small>one time</small></div>" +
      '<ul class="reads"><li><span class="y">' + I.check + '</span><span>Verified US credit profile</span></li>' +
      '<li><span class="y">' + I.check + '</span><span>Share with any bank or landlord for 12 months</span></li>' +
      '<li><span class="y">' + I.check + '</span><span>AI assistant and dispute support</span></li></ul></div>' +
    '<div class="why">' + I.shield + "<div><b>Why you pay us, not the banks</b><span>We never sell your data and take no commission from banks. Our only job is getting you approved.</span></div></div>" +
    '<div class="note"><div class="ic">' + I.card + "</div><div>No charge today. Reserve now and we'll email you before launch to confirm.</div></div>" +
    '<div class="spacer"></div>' +
    '<div class="foot">' + primary("Reserve at $" + p, true, "reserve") +
      '<button type="button" class="btn link" data-act="notify">Not now, just notify me</button></div>';
}
function sMatch() {
  const exp = hereNow()
    ? '<div class="q"><div class="q-title">Since you arrived, has any of this happened? <span class="small">(optional)</span></div>' + chips("experience", EXPERIENCE, true) + "</div>"
    : "";
  return bar(5) +
    "<h1>Cards matched to you</h1>" +
    '<p class="sub">At launch we match partner cards to your profile. Tell us what you need first.</p>' +
    '<div class="q"><div class="q-title">When do you land?</div>' + chips("arrival", ARRIVALS) + "</div>" +
    '<div class="q"><div class="q-title">What do you need credit for first?</div><div class="small" style="margin-top:-6px">Pick all that apply.</div>' + chips("first_needs", NEEDS, true) + "</div>" +
    exp +
    '<div class="spacer"></div>' +
    '<div class="foot">' + primary("Continue", Boolean(S.arrival && S.first_needs.length)) + "</div>";
}
function sWaitlist() {
  return bar(6) +
    "<h1>Save your spot</h1>" +
    '<p class="sub">' + (S.price_choice === "reserve" ? "Your $" + S.price_variant + " founding price is held. " : "") + "We'll send your early access invite here.</p>" +
    '<div class="q"><label class="q-title" for="email">Email</label><input id="email" class="text-input" type="email" inputmode="email" autocomplete="email" data-text="email" placeholder="you@university.edu" value="' + esc(S.email) + '"></div>' +
    '<div class="q"><div class="q-title">How did you hear about Carryon? <span class="small">(optional)</span></div>' + chips("heard_from", HEARD) + "</div>" +
    check("c-contact", "contact_ok", "soft", "Email me about early access. I can unsubscribe any time.", "") +
    '<p class="small" style="margin:0">We keep your answers and email in our team\'s private spreadsheet to plan the launch. This page never asks for your passport, visa or PAN number. To delete your answers, write to ' + esc(CONFIG.CONTACT_EMAIL) + ".</p>" +
    '<p class="error" id="err" hidden></p>' +
    '<div class="spacer"></div>' +
    '<div class="foot">' + primary("Join the waitlist", emailOk() && S.contact_ok, "join") + "</div>";
}
function sDone() {
  const base = CONFIG.PUBLIC_URL || (LIVE ? location.origin + location.pathname : "");
  const link = base ? base + "?ref=" + S.ref_code : "";
  const steps = [
    ["Joined the waitlist", "Today", true],
    [S.share_report_early === "yes" ? "Early US estimate" : "Early access invite", S.share_report_early === "yes" ? "We'll email you this week" : "Before launch", false],
    ["Your US credit profile", "At launch", false],
    ["Your first card", "After launch", false]
  ];
  return '<div class="done-mark pop">' + I.check + "</div>" +
    '<h1 class="center">You\'re on the list</h1>' +
    '<p class="sub center" style="margin:-8px auto 0">' + (S.price_choice === "reserve" ? "Founding price $" + S.price_variant + " held. Nothing is charged until you say yes." : "We'll email you before Carryon launches.") + "</p>" +
    (S.position ? '<p class="center" style="margin:0;font-weight:700">You\'re number ' + S.position + " on the waitlist</p>" : "") +
    '<div class="label">Your spot</div>' +
    '<ol class="timeline">' + steps.map(s => '<li class="' + (s[2] ? "on" : "") + '"><span class="dot"></span><div><b>' + esc(s[0]) + "</b><span>" + esc(s[1]) + "</span></div></li>").join("") + "</ol>" +
    '<div class="q"><div class="q-title">Know someone moving to the US?</div>' +
      (link ? '<div class="share"><code id="share-link">' + esc(link) + '</code><button type="button" class="btn" data-act="copy">Copy</button></div>'
            : '<p class="small" style="margin:0">Your invite link appears here once the page is live.</p>') +
    "</div>" +
    '<div class="spacer"></div>' +
    '<div class="foot"><button type="button" class="btn link" data-act="reset">Not you? Start over</button></div>';
}
const SCREENS = [sWelcome, sVerify, sPan, sConsent, sPrice, sMatch, sWaitlist, sDone];

/* ---------- Render ---------- */
function render() {
  $("stage").innerHTML = SCREENS[S.screen]();
  const pv = $("preview");
  if (!LIVE) {
    pv.hidden = false;
    pv.innerHTML = "<b>Preview.</b> Answers on this copy aren't saved. You're seeing the " + (S.consent_variant === "controls" ? "privacy-controls" : "plain") + " consent screen and the $" + S.price_variant + " price.";
  } else pv.hidden = true;
  save();
}
function go(screen) { S.screen = screen; S.picking_country = false; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function refreshNext() {
  const btn = $("next");
  if (btn && S.screen === 6) btn.disabled = !(emailOk() && S.contact_ok);
  if (btn && S.screen === 3) btn.textContent = S.consent_given === "yes" ? "Allow and continue" : "Continue";
}

/* ---------- Events ---------- */
document.addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip");
  if (chip) {
    const key = chip.dataset.key, val = chip.dataset.value;
    if (chip.dataset.multi) {
      const list = S[key], i = list.indexOf(val);
      if (i >= 0) list.splice(i, 1); else list.push(val);
      if (key === "experience" && val === "None of these" && i < 0) S.experience = ["None of these"];
      else if (key === "experience" && val !== "None of these") S.experience = S.experience.filter(x => x !== "None of these");
    } else {
      S[key] = (S[key] === val && key !== "country") ? "" : val;
      if (key === "home_score" && S.home_score !== "Yes") S.home_score_band = "";
      if (key === "country") { S.picking_country = false; if (!isIndia()) { S.home_score_band = ""; S.pan = ""; } }
      if (key === "status" && S.status !== VISAS[0]) S.university = "";
      if (key === "arrival" && !hereNow()) S.experience = [];
    }
    render();
    const again = document.querySelector('.chip[data-key="' + key + '"][data-value="' + CSS.escape(val) + '"]');
    if (again) again.focus();
    return;
  }
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a === "pick-country") { S.picking_country = !S.picking_country; render(); return; }
  if (a === "start") { go(1); return; }
  if (a === "back") { go(Math.max(0, S.screen - 1)); return; }
  if (a === "next") {
    if (S.screen === 3) {
      S.consent_given = S.consent_given === "yes" ? "yes" : "no";
      S.share_report_early = S.share_report_early === "yes" ? "yes" : "no";
    }
    complete(S.screen);
    go(S.screen + 1);
    return;
  }
  if (a === "reserve" || a === "notify") { S.price_choice = a; complete(4); go(5); return; }
  if (a === "join") { join(el); return; }
  if (a === "copy") {
    const text = $("share-link").textContent;
    try { navigator.clipboard.writeText(text).then(() => { el.textContent = "Copied"; }, () => { el.textContent = "Select and copy"; }); }
    catch (e) { el.textContent = "Select and copy"; }
    return;
  }
  if (a === "reset") {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    S = freshState(); S.opened_sent = true; render(); complete(0);
  }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.check) {
    const key = el.dataset.check;
    S[key] = key === "contact_ok" ? el.checked : (el.checked ? "yes" : "");
    save(); refreshNext();
  }
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.text) { S[el.dataset.text] = el.value.slice(0, 120); save(); refreshNext(); }
});

async function join(btn) {
  btn.disabled = true; btn.textContent = "Saving your spot…";
  const err = $("err"); err.hidden = true;
  const prev = S.last_step;
  S.last_step = 6;
  const res = await send();
  if (LIVE && !res.saved) {
    S.last_step = prev;
    err.textContent = "We couldn't save your spot. Check your connection and try again.";
    err.hidden = false; btn.disabled = false; btn.textContent = "Join the waitlist";
    return;
  }
  save();
  S.position = await fetchPosition();
  go(7);
}

/* ---------- Start ---------- */
function start(snapshot) {
  S = (snapshot && snapshot.session_id) ? Object.assign(freshState(), snapshot) : load();
  render();
  if (!S.opened_sent) { S.opened_sent = true; complete(0); }
}
if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => S);
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot ? window.claude.hot.data : {});
</script>
</body>
</html>
